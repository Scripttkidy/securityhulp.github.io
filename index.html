<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Phishing-simulatie</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      padding-top: 80px;
    }
    .box {
      background: white;
      padding: 30px;
      width: 320px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 2px 10px #ccc;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Phishing-simulatie</h2>
    <p>Dit is een schooldemonstratie.</p>

    <form onsubmit="demo(event)">
      <input type="text" placeholder="Gebruikersnaam" required>
      <input type="password" placeholder="Wachtwoord" required>
      <button type="submit">Inloggen</button>
    </form>

    <p id="result"></p>
  </div>

  <script>
    function demo(event) {
      event.preventDefault();

      // Er worden bewust GEEN gegevens opgeslagen of verzonden.
      document.getElementById("result").textContent =
        "Dit was een phishing-simulatie! Deel nooit je wachtwoord via een verdachte pagina.";
    }
  </script>
</body>
</html>
